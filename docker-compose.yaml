services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"

    volumes:
      - ./docker/db/init-order.sh:/docker-entrypoint-initdb.d/init-order.sh

  order-service:
    build: .
    container_name: order-service
    ports:
      - "8082:8082"
    depends_on:
      - db
    env_file:
      - .env.docker