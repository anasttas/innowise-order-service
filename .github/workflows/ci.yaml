name: Order Service CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository_owner }}/order-service
  DOCKER_TAG: ${{ github.sha }}

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests --batch-mode

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: target/*.jar
          retention-days: 1



  test:
    name: Testing
    runs-on: ubuntu-latest
    needs: build


    services:

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: order_db
        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/order_db
          DB_USER: postgres
          DB_PASSWORD: postgres

          USER_SERVICE_URL: http://localhost:8080/shop

        run: mvn test --batch-mode


      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7



      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 7

  sonar:

    name: Code Analysis (SonarQube)
    runs-on: ubuntu-latest
    needs: test


    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar


      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        run: |
          mvn verify sonar:sonar \
          -Dsonar.projectKey=${{ github.event.repository.name }} \
          -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
          -Dsonar.token=${{ env.SONAR_TOKEN }} \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          --batch-mode



      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}




  docker:

    name: Docker Image Build & Push
    runs-on: ubuntu-latest
    needs: sonar


    steps:


      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: target/


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5

        with:
          images: ${{ env.DOCKER_IMAGE }}

          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}



      - name: Build and push Docker image
        uses: docker/build-push-action@v5

        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max



      - name: Print image digest
        run: echo ${{ steps.meta.outputs.digest }}